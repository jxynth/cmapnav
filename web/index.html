<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CMapNav — Interactive road network navigation powered by OpenStreetMap. Plan routes with Dijkstra and A* pathfinding algorithms.">
    <title>CMapNav — Interactive Map Navigation</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="anonymous">

    <!-- App CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <!-- ═══════ Sidebar ═══════ -->
        <aside class="sidebar">

            <!-- Logo -->
            <div class="logo">
                <h1>🧭 CMapNav</h1>
                <div class="subtitle">OpenStreetMap Powered Navigation</div>
            </div>

            <!-- ── Download Area ── -->
            <div class="section" id="download-section">
                <div class="section-title">📥 Download Area</div>

                <select id="preset-select">
                    <!-- populated by JS -->
                </select>

                <div class="custom-bbox" id="custom-bbox">
                    <input type="text" id="custom-south" placeholder="South lat (e.g. 12.92)">
                    <input type="text" id="custom-west"  placeholder="West lon (e.g. 77.61)">
                    <input type="text" id="custom-north" placeholder="North lat (e.g. 12.95)">
                    <input type="text" id="custom-east"  placeholder="East lon (e.g. 77.64)">
                </div>

                <div style="margin-top: 10px;">
                    <button class="btn btn-primary" id="btn-download" style="width:100%;">
                        ⬇ Download Area
                    </button>
                </div>

                <div class="download-status" id="download-status"></div>

                <!-- Stats -->
                <div class="stats-panel" id="stats-panel">
                    <div class="stats-row">
                        <span>Nodes</span>
                        <span id="stats-nodes">—</span>
                    </div>
                    <div class="stats-row">
                        <span>Edges</span>
                        <span id="stats-edges">—</span>
                    </div>
                </div>

                <!-- Road overlay toggle -->
                <div class="toggle-row">
                    <span>Show road network</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggle-roads" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>

            <!-- ── Route Planning ── -->
            <div class="section">
                <div class="section-title">🛣️ Route Planning</div>

                <!-- Origin -->
                <div class="input-group">
                    <label><span class="dot dot-origin"></span> Origin</label>
                    <div class="input-row">
                        <input type="text" id="origin-input" placeholder="Search or click map...">
                        <button class="btn-icon" id="btn-set-origin" title="Click map to set origin">📍</button>
                    </div>
                    <div class="search-results"></div>
                </div>

                <!-- Swap -->
                <div class="swap-container">
                    <button class="btn-icon" id="btn-swap" title="Swap origin & destination">⇅</button>
                </div>

                <!-- Destination -->
                <div class="input-group">
                    <label><span class="dot dot-dest"></span> Destination</label>
                    <div class="input-row">
                        <input type="text" id="dest-input" placeholder="Search or click map...">
                        <button class="btn-icon" id="btn-set-dest" title="Click map to set destination">📍</button>
                    </div>
                    <div class="search-results"></div>
                </div>

                <!-- Options -->
                <div class="route-options">
                    <select id="route-mode">
                        <option value="shortest">🛤️ Shortest</option>
                        <option value="fastest">⚡ Fastest</option>
                    </select>
                    <select id="algo-select">
                        <option value="astar">A* Algorithm</option>
                        <option value="dijkstra">Dijkstra's</option>
                    </select>
                </div>

                <!-- Action buttons -->
                <div class="route-actions">
                    <button class="btn btn-primary" id="btn-route">🔍 Find Route</button>
                    <button class="btn btn-outline" id="btn-clear">✕ Clear</button>
                </div>
            </div>

            <!-- ── Route Summary ── -->
            <div class="section">
                <div class="section-title">📋 Directions</div>
                <div class="route-summary" id="route-summary"></div>
                <div class="directions-panel" id="directions-panel"></div>
            </div>

        </aside>

        <!-- ═══════ Map ═══════ -->
        <div id="map"></div>

    </div>

    <!-- Toast notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="anonymous"></script>

    <!-- App JS (ES modules) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
